openapi: 3.0.3
info:
  title: Penjualan API
  description: >
    API untuk mengelola data pelanggan, produk, dan transaksi penjualan.
    Dirancang secara contract-first berdasarkan skema database yang sudah
    dibuat di Neon (tabel `pelanggan`, `produk`, `penjualan`).


    **Kematangan REST (Richardson Maturity Model):** resource `penjualan`
    dan `produk` sudah berada di **Level 3 (HATEOAS)** karena punya state
    yang bertransisi (status transaksi; stok produk) — setiap response
    menyertakan array `links` berisi aksi yang valid dari state saat itu.
    Resource `pelanggan` sengaja tetap di **Level 2**: hanya data statis
    tanpa transisi state, sehingga HATEOAS tidak menambah nilai di sana.
  version: 1.1.0
  contact:
    name: Bambang
    email: bambang@example.com

servers:
  - url: https://open-api-prakwebservice.vercel.app/api
    description: Production (Vercel)
  - url: http://localhost:3000/api
    description: Local development

tags:
  - name: Pelanggan
    description: Operasi pada data pelanggan
  - name: Produk
    description: Operasi pada data produk
  - name: Penjualan
    description: Operasi pada data transaksi penjualan

paths:
  /pelanggan:
    get:
      tags: [Pelanggan]
      summary: Ambil daftar pelanggan
      description: Mengembalikan seluruh data pelanggan. Bisa difilter berdasarkan kota.
      parameters:
        - name: kota
          in: query
          description: Filter pelanggan berdasarkan kota
          required: false
          schema:
            type: string
          example: Surabaya
      responses:
        '200':
          description: Berhasil mengambil daftar pelanggan
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pelanggan'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Pelanggan]
      summary: Tambah pelanggan baru
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PelangganInput'
      responses:
        '201':
          description: Pelanggan berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pelanggan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /pelanggan/{id}:
    parameters:
      - $ref: '#/components/parameters/PelangganId'
    get:
      tags: [Pelanggan]
      summary: Ambil detail satu pelanggan
      responses:
        '200':
          description: Berhasil mengambil detail pelanggan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pelanggan'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Pelanggan]
      summary: Perbarui data pelanggan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PelangganInput'
      responses:
        '200':
          description: Pelanggan berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pelanggan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Pelanggan]
      summary: Hapus pelanggan
      responses:
        '204':
          description: Pelanggan berhasil dihapus
        '404':
          $ref: '#/components/responses/NotFound'

  /produk:
    get:
      tags: [Produk]
      summary: Ambil daftar produk
      description: Mengembalikan seluruh data produk. Bisa difilter berdasarkan kategori.
      parameters:
        - name: kategori
          in: query
          description: Filter produk berdasarkan kategori
          required: false
          schema:
            type: string
          example: Minuman
      responses:
        '200':
          description: Berhasil mengambil daftar produk
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Produk'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Produk]
      summary: Tambah produk baru
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProdukInput'
      responses:
        '201':
          description: Produk berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Produk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /produk/{id}:
    parameters:
      - $ref: '#/components/parameters/ProdukId'
    get:
      tags: [Produk]
      summary: Ambil detail satu produk
      responses:
        '200':
          description: Berhasil mengambil detail produk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Produk'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Produk]
      summary: Perbarui data produk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProdukInput'
      responses:
        '200':
          description: Produk berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Produk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Produk]
      summary: Hapus produk
      responses:
        '204':
          description: Produk berhasil dihapus
        '404':
          $ref: '#/components/responses/NotFound'

  /produk/{id}/restock:
    parameters:
      - $ref: '#/components/parameters/ProdukId'
    post:
      tags: [Produk]
      summary: Tambah stok produk (aksi RMM Level 3)
      description: >
        Menambah stok produk sebanyak `tambah`. Link `restock` hanya muncul di
        response produk (field `links`) ketika `stok` produk tersebut 0 — lihat
        `produkLinks()` di `lib/links.js`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tambah:
                  type: integer
                  description: Jumlah stok yang ditambahkan, harus > 0
                  example: 20
              required: [tambah]
      responses:
        '200':
          description: Stok berhasil ditambahkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Produk'
        '400':
          description: Field "tambah" tidak diisi atau <= 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /penjualan:
    get:
      tags: [Penjualan]
      summary: Ambil daftar transaksi penjualan
      description: Mengembalikan seluruh data penjualan. Bisa difilter berdasarkan pelanggan, produk, status, atau rentang tanggal.
      parameters:
        - name: pelanggan_id
          in: query
          required: false
          schema:
            type: integer
        - name: produk_id
          in: query
          required: false
          schema:
            type: integer
        - name: status
          in: query
          description: Filter berdasarkan status transaksi
          required: false
          schema:
            $ref: '#/components/schemas/PenjualanStatus'
        - name: tanggal_mulai
          in: query
          description: Filter tanggal awal (YYYY-MM-DD)
          required: false
          schema:
            type: string
            format: date
        - name: tanggal_akhir
          in: query
          description: Filter tanggal akhir (YYYY-MM-DD)
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Berhasil mengambil daftar penjualan
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Penjualan'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Penjualan]
      summary: Catat transaksi penjualan baru
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PenjualanInput'
      responses:
        '201':
          description: Transaksi penjualan berhasil dicatat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Penjualan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: pelanggan_id atau produk_id yang dirujuk tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'

  /penjualan/{id}:
    parameters:
      - $ref: '#/components/parameters/PenjualanId'
    get:
      tags: [Penjualan]
      summary: Ambil detail satu transaksi penjualan
      responses:
        '200':
          description: Berhasil mengambil detail transaksi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Penjualan'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Penjualan]
      summary: Perbarui transaksi penjualan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PenjualanInput'
      responses:
        '200':
          description: Transaksi berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Penjualan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Transaksi, pelanggan_id, atau produk_id yang dirujuk tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Penjualan]
      summary: Hapus transaksi penjualan
      responses:
        '204':
          description: Transaksi berhasil dihapus
        '404':
          $ref: '#/components/responses/NotFound'

  /penjualan/{id}/approve:
    parameters:
      - $ref: '#/components/parameters/PenjualanId'
    post:
      tags: [Penjualan]
      summary: Setujui transaksi (pending -> disetujui)
      description: Link `approve` hanya muncul di response saat status transaksi masih `pending`.
      responses:
        '200':
          description: Transaksi berhasil disetujui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Penjualan'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /penjualan/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/PenjualanId'
    post:
      tags: [Penjualan]
      summary: Batalkan transaksi (pending|disetujui -> dibatalkan)
      description: Link `cancel` hanya muncul di response saat status transaksi `pending` atau `disetujui`.
      responses:
        '200':
          description: Transaksi berhasil dibatalkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Penjualan'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /penjualan/{id}/kirim:
    parameters:
      - $ref: '#/components/parameters/PenjualanId'
    post:
      tags: [Penjualan]
      summary: Kirim transaksi (disetujui -> dikirim)
      description: Link `kirim` hanya muncul di response saat status transaksi `disetujui`.
      responses:
        '200':
          description: Transaksi berhasil ditandai terkirim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Penjualan'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  parameters:
    PelangganId:
      name: id
      in: path
      required: true
      description: ID pelanggan
      schema:
        type: integer
      example: 1
    ProdukId:
      name: id
      in: path
      required: true
      description: ID produk
      schema:
        type: integer
      example: 1
    PenjualanId:
      name: id
      in: path
      required: true
      description: ID transaksi penjualan
      schema:
        type: integer
      example: 1

  schemas:
    Link:
      type: object
      description: Satu HATEOAS link (gaya PayPal — rel/href/method).
      properties:
        rel:
          type: string
          description: Nama aksi/relasi
          example: approve
        href:
          type: string
          description: URL tujuan (relatif atau absolut, tergantung endpoint)
          example: /api/penjualan/42/approve
        method:
          type: string
          description: HTTP method yang harus dipakai untuk memanggil href ini
          example: POST
      required: [rel, href, method]

    Pelanggan:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
          example: 1
        nama:
          type: string
          example: Budi Santoso
        email:
          type: string
          format: email
          nullable: true
          example: budi.santoso@email.com
        no_telepon:
          type: string
          nullable: true
          example: '081234567801'
        kota:
          type: string
          nullable: true
          example: Surabaya
      required: [id, nama]

    PelangganInput:
      type: object
      properties:
        nama:
          type: string
          example: Budi Santoso
        email:
          type: string
          format: email
          nullable: true
          example: budi.santoso@email.com
        no_telepon:
          type: string
          nullable: true
          example: '081234567801'
        kota:
          type: string
          nullable: true
          example: Surabaya
      required: [nama]

    Produk:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
          example: 1
        nama_produk:
          type: string
          example: Kopi Susu
        kategori:
          type: string
          nullable: true
          example: Minuman
        harga:
          type: number
          format: double
          example: 18000
        stok:
          type: integer
          default: 0
          example: 100
        links:
          type: array
          description: >
            HATEOAS links (RMM Level 3). Berisi `restock` kalau stok = 0, atau
            `beli` kalau stok > 0. Hanya muncul di response GET/PUT
            `/produk/{id}` dan `POST /produk/{id}/restock` — belum ada di
            list `GET /produk` maupun `POST /produk`.
          items:
            $ref: '#/components/schemas/Link'
          example:
            - { rel: self, href: /api/produk/1, method: GET }
            - { rel: restock, href: /api/produk/1/restock, method: POST }
            - { rel: swagger, href: /openapi.yaml, method: GET }
      required: [id, nama_produk, harga]

    ProdukInput:
      type: object
      properties:
        nama_produk:
          type: string
          example: Kopi Susu
        kategori:
          type: string
          nullable: true
          example: Minuman
        harga:
          type: number
          format: double
          example: 18000
        stok:
          type: integer
          default: 0
          example: 100
      required: [nama_produk, harga]

    Penjualan:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
          example: 1
        pelanggan_id:
          type: integer
          example: 1
        produk_id:
          type: integer
          example: 1
        jumlah:
          type: integer
          example: 3
        tanggal:
          type: string
          format: date
          example: '2026-08-01'
        total:
          type: number
          format: double
          example: 54000
        status:
          allOf:
            - $ref: '#/components/schemas/PenjualanStatus'
          readOnly: true
        links:
          type: array
          description: >
            HATEOAS links (RMM Level 3), menyesuaikan `status` saat ini —
            lihat `penjualanLinks()` di `lib/links.js`. Response detail
            (GET/POST/PUT `/penjualan/{id}` dan endpoint aksi) berisi link
            kontekstual lengkap (`approve`/`cancel`/`kirim` sesuai status,
            plus `pelanggan`, `produk`, `swagger`); response list
            (`GET /penjualan`) hanya berisi `self`.
          items:
            $ref: '#/components/schemas/Link'
          example:
            - { rel: self, href: /api/penjualan/42, method: GET }
            - { rel: pelanggan, href: /api/pelanggan/1, method: GET }
            - { rel: produk, href: /api/produk/1, method: GET }
            - { rel: approve, href: /api/penjualan/42/approve, method: POST }
            - { rel: cancel, href: /api/penjualan/42/cancel, method: POST }
            - { rel: swagger, href: /openapi.yaml, method: GET }
      required: [id, pelanggan_id, produk_id, jumlah, status]

    PenjualanStatus:
      type: string
      description: >
        State transaksi. Transisi hanya lewat endpoint aksi
        (`/approve`, `/cancel`, `/kirim`), tidak lewat PUT.
      enum: [pending, disetujui, dikirim, dibatalkan]
      example: pending

    PenjualanInput:
      type: object
      properties:
        pelanggan_id:
          type: integer
          example: 1
        produk_id:
          type: integer
          example: 1
        jumlah:
          type: integer
          example: 3
        tanggal:
          type: string
          format: date
          description: Opsional — default ke tanggal hari ini jika tidak diisi
          example: '2026-08-01'
        total:
          type: number
          format: double
          description: Opsional — bisa dihitung otomatis di server dari harga x jumlah
          example: 54000
      required: [pelanggan_id, produk_id, jumlah]

    Error:
      type: object
      properties:
        code:
          type: integer
          example: 404
        message:
          type: string
          example: Data tidak ditemukan
      required: [code, message]

  responses:
    BadRequest:
      description: Permintaan tidak valid (field wajib kosong atau format salah)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Data tidak ditemukan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: Terjadi kesalahan pada server
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: >
        Aksi tidak valid untuk status transaksi saat ini (mis. approve
        transaksi yang sudah dikirim)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'